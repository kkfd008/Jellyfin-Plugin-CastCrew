<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CastCrew</title>
    <style>
    :root {
        --cw-bg: #0d1117;
        --cw-panel: #161b22;
        --cw-border: #2d333b;
        --cw-text: #e6edf3;
        --cw-muted: #9da7b3;
        --cw-accent: #2f81f7;
        --cw-danger: #f85149;
    }

    body {
        margin: 0;
        padding: 0;
        background: var(--cw-bg);
        color: var(--cw-text);
        font-family: "Segoe UI", "Noto Sans", sans-serif;
    }

    .castcrew-page {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 16px 40px;
    }

    .castcrew-header {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    .castcrew-title {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.2px;
    }

    .castcrew-toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
    }

    .castcrew-input,
    .castcrew-select,
    .castcrew-button {
        border: 1px solid var(--cw-border);
        background: var(--cw-panel);
        color: var(--cw-text);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
    }

    .castcrew-input {
        min-width: 200px;
    }

    .castcrew-age-input {
        width: 80px;
        min-width: 60px;
    }

    .castcrew-button {
        cursor: pointer;
    }

    .castcrew-button:hover {
        border-color: var(--cw-accent);
    }

    .castcrew-meta {
        color: var(--cw-muted);
        margin: 8px 0 18px;
        font-size: 13px;
    }

    .castcrew-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 14px;
    }

    .castcrew-card {
        border: 1px solid var(--cw-border);
        background: var(--cw-panel);
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 120ms ease, border-color 120ms ease;
        text-align: left;
    }

    .castcrew-card:hover,
    .castcrew-card:focus-visible {
        transform: translateY(-2px);
        border-color: var(--cw-accent);
        outline: none;
    }

    .castcrew-image-wrap {
        width: 100%;
        aspect-ratio: 2 / 3;
        background: #11161d;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .castcrew-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .castcrew-placeholder {
        color: var(--cw-muted);
        font-size: 12px;
    }

    .castcrew-info {
        padding: 10px;
    }

    .castcrew-name {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
    }

    .castcrew-overview {
        margin-top: 8px;
        font-size: 12px;
        color: var(--cw-muted);
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 44px;
    }

    .castcrew-state {
        border: 1px solid var(--cw-border);
        background: var(--cw-panel);
        color: var(--cw-text);
        border-radius: 10px;
        padding: 14px;
        margin-top: 10px;
    }

    .castcrew-state.error {
        border-color: rgba(248, 81, 73, 0.55);
        color: #ffd6d3;
    }

    .castcrew-section {
        margin-top: 20px;
    }

    .castcrew-section-header {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--cw-border);
        color: var(--cw-text);
    }

    .castcrew-section-header .castcrew-match-count {
        font-weight: 400;
        color: var(--cw-muted);
        font-size: 14px;
        margin-left: 8px;
    }

    .castcrew-section-empty {
        color: var(--cw-muted);
        font-size: 14px;
        padding: 12px 0;
    }

    .castcrew-section-divider {
        border: none;
        border-top: 1px solid var(--cw-border);
        margin: 24px 0 4px;
    }

    .castcrew-pagination {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
    }

    .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
    }

    @media (max-width: 768px) {
        .castcrew-title {
            font-size: 24px;
        }

        .castcrew-input {
            min-width: 170px;
            width: 100%;
        }

        .castcrew-toolbar {
            width: 100%;
        }
    }
    </style>
</head>
<body>
<div data-role="page" id="castCrewPage" class="page type-interior pluginPage fullWidthContent">
    <div class="content-primary">
        <main class="castcrew-page" id="castcrewPage" role="main" aria-busy="true">
            <div class="castcrew-header">
                <h1 class="castcrew-title" id="actorsTitle">Actors</h1>
                <div class="castcrew-toolbar">
                    <label id="searchInputLabel" class="visually-hidden" for="searchInput">Search actors</label>
                    <input id="searchInput" class="castcrew-input" type="search" placeholder="Search actors" />

                    <!-- 新增：最小年龄输入框 -->
                    <input id="minAgeInput" class="castcrew-input castcrew-age-input" type="number" min="1" max="98" placeholder="Min Age" />
                    <span style="color:var(--cw-muted)">-</span>
                    <!-- 新增：最大年龄输入框 -->
                    <input id="maxAgeInput" class="castcrew-input castcrew-age-input" type="number" min="14" max="99" placeholder="Max Age" />

                    <label id="sortSelectLabel" class="visually-hidden" for="sortSelect">Sort actors</label>
                    <select id="sortSelect" class="castcrew-select" aria-label="Sort actors">
                        <option id="sortNameOption" value="Name,Ascending">Name (A-Z)</option>
                        <option id="sortNameDescOption" value="Name,Descending">Name (Z-A)</option>
                        <option id="sortDateOption" value="DateCreated,Descending">Recently Added</option>
                        <option id="sortRandomOption" value="Random,Ascending">Random</option>
                        <!-- 新增：年龄排序选项 -->
                        <option id="sortAgeDescOption" value="Age,Descending">Age (Oldest)</option>
                        <option id="sortAgeAscOption" value="Age,Ascending">Age (Youngest)</option>
                    </select>

                    <label id="librarySelectLabel" class="visually-hidden" for="librarySelect">Filter by library</label>
                    <select id="librarySelect" class="castcrew-select" aria-label="Filter by library">
                        <option id="libraryAllOption" value="">All Libraries</option>
                    </select>
                </div>
            </div>

            <div id="castCrewMeta" class="castcrew-meta" role="status" aria-live="polite">Loading...</div>
            <div id="castCrewContent" aria-live="polite"></div>
        </main>
    </div>
</div>

<script>
// 在全局或初始化时绑定多语言和年龄参数传递逻辑
(function() {
    // 简单的多语言映射定义
    const i18n = {
        "zh-CN": {
            searchPlaceholder: "搜索演员...",
            minAge: "最小年龄",
            maxAge: "最大年龄",
            sortNameAsc: "姓名 (A-Z)",
            sortNameDesc: "姓名 (Z-A)",
            sortDate: "最近添加",
            sortRandom: "随机",
            sortAgeDesc: "年龄 (从大到小)",
            sortAgeAsc: "年龄 (从小到大)"
        },
        "en-US": {
            searchPlaceholder: "Search actors...",
            minAge: "Min Age",
            maxAge: "Max Age",
            sortNameAsc: "Name (A-Z)",
            sortNameDesc: "Name (Z-A)",
            sortDate: "Recently Added",
            sortRandom: "Random",
            sortAgeDesc: "Age (Oldest)",
            sortAgeAsc: "Age (Youngest)"
        }
    };

    // 动态应用语言翻译
    async function applyLanguage() {
        let lang = "auto";
        try {
            const plugins = await ApiClient.getInstalledPlugins();
            const plugin = plugins.find(p => p.Name === 'CastCrew');
            if (plugin) {
                const config = await ApiClient.getPluginConfiguration(plugin.Id);
                lang = config.UILanguage || "auto";
            }
        } catch(e) {}

        if (lang === "auto") {
            const browserLang = navigator.language || navigator.userLanguage;
            lang = browserLang && browserLang.startsWith("zh") ? "zh-CN" : "en-US";
        }

        const t = i18n[lang] || i18n["en-US"];
        const searchInput = document.querySelector('#searchInput');
        const minAgeInput = document.querySelector('#minAgeInput');
        const maxAgeInput = document.querySelector('#maxAgeInput');

        if (searchInput) searchInput.placeholder = t.searchPlaceholder;
        if (minAgeInput) minAgeInput.placeholder = t.minAge;
        if (maxAgeInput) maxAgeInput.placeholder = t.maxAge;

        const optName = document.querySelector('#sortNameOption');
        const optNameDesc = document.querySelector('#sortNameDescOption');
        const optDate = document.querySelector('#sortDateOption');
        const optRandom = document.querySelector('#sortRandomOption');
        const optAgeDesc = document.querySelector('#sortAgeDescOption');
        const optAgeAsc = document.querySelector('#sortAgeAscOption');

        if (optName) optName.textContent = t.sortNameAsc;
        if (optNameDesc) optNameDesc.textContent = t.sortNameDesc;
        if (optDate) optDate.textContent = t.sortDate;
        if (optRandom) optRandom.textContent = t.sortRandom;
        if (optAgeDesc) optAgeDesc.textContent = t.sortAgeDesc;
        if (optAgeAsc) optAgeAsc.textContent = t.sortAgeAsc;
    }

    document.addEventListener('viewshow', applyLanguage);
    
    // 拦截和拓展原生的 ApiClient.getJSON 请求，把 MinAge 和 MaxAge 拼接到后端查询 URL 中
    document.addEventListener('DOMContentLoaded', function() {
        if (window.ApiClient && !window.originalGetJSON_CC) {
            window.originalGetJSON_CC = window.ApiClient.getJSON;
            window.ApiClient.getJSON = function(url) {
                if (url && url.includes('/CastCrew/Actors')) {
                    const minAge = document.querySelector('#minAgeInput')?.value;
                    const maxAge = document.querySelector('#maxAgeInput')?.value;
                    if (minAge) url += '&MinAge=' + encodeURIComponent(minAge);
                    if (maxAge) url += '&MaxAge=' + encodeURIComponent(maxAge);
                }
                return window.originalGetJSON_CC.apply(this, arguments);
            };
        }
    });
})();
</script>
</body>
</html>
